<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto Staff 77 - Chulas Burgers</title>
<style>
  body { background-color: #121216; color: #f5f5f7; font-family: sans-serif; margin: 0; padding: 15px; }
  h1, h2, h3 { text-align: center; color: #00bcd4; margin-top: 0; }
  
  .vista { display: none; }
  .vista.activa { display: block; }
  
  .grid-meseros { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 600px; margin: 40px auto; }
  .btn-mesero { background: #1e1e24; border: 2px solid #00bcd4; color: white; padding: 20px 40px; border-radius: 8px; font-size: 1.2rem; cursor: pointer; width: 45%; }
  .btn-mesero:hover { background: #00bcd4; color: #111; }
  
  .header-mesas { text-align: center; margin-bottom: 20px; }
  .grid-mesas { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; max-width: 800px; margin: 0 auto; }
  .btn-mesa { background: #1e1e24; border: 1px solid #444; border-radius: 8px; padding: 15px; color: white; text-align: center; cursor: pointer; position: relative;}
  .btn-mesa.ocupada { border-color: #ff9800; background: #332200; }
  .btn-mesa span { display: block; font-size: 0.8rem; color: #aaa; margin-top: 5px; }
  .btn-mesa.ocupada span { color: #ff9800; }
  .etiqueta-mesero { font-size: 0.7rem; color: #00bcd4; font-weight: bold; margin-top: 5px; display: block;}
  
  .btn-logout { background: #f44336; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 30px; }

  .header-menu { display: flex; justify-content: space-between; align-items: center; background: #1e1e24; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
  .btn-volver, .btn-admin-accion { background: #444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
  .btn-admin-accion { background: #ff5722; font-weight: bold; }
  
  .grid-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 80px; }
  .card-prod { background: #1e1e24; border-radius: 8px; padding-bottom: 15px; text-align: center; border: 1px solid #333; }
  .img-prod { width: 100%; height: 140px; object-fit: cover; border-radius: 8px 8px 0 0; display: block; }
  .precio { color: #ff9800; font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
  .controles { display: flex; gap: 5px; padding: 0 10px; margin-bottom: 10px; }
  .input-cant { width: 50px; padding: 8px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; text-align: center; }
  .input-nota { flex-grow: 1; padding: 8px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; }
  .btn-add { background: #00bcd4; color: #111; border: none; padding: 10px; width: 90%; border-radius: 5px; font-weight: bold; cursor: pointer; }
  
  .flotante-carrito { position: fixed; bottom: 20px; right: 20px; background: #ff9800; color: #111; padding: 15px 20px; border-radius: 30px; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  
  .seccion-carrito { background: #111; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #333; }
  .seccion-carrito h4 { margin-top: 0; color: #aaa; border-bottom: 1px solid #444; padding-bottom: 5px; }
  .item-carrito { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; padding: 8px 0; }
  .btn-eliminar { background: #f44336; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 4px 8px; }
  .btn-eliminar-admin { background: #ff5722; }
  .btn-accion-cuenta { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1rem; }
  .btn-mesa-abierta { background: #2196F3; color: white; }
  .btn-pedir-cuenta { background: #4CAF50; color: white; }
  
  .modal-ticket { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
  .ticket-content { background: #fff; color: #111; padding: 20px; border-radius: 5px; width: 100%; max-width: 350px; font-family: 'Courier New', Courier, monospace; }
  .ticket-content h3 { text-align: center; margin-top: 0; border-bottom: 2px dashed #111; padding-bottom: 10px; }
  .ticket-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
  .ticket-total { font-weight: bold; font-size: 1.2rem; text-align: right; margin-top: 15px; border-top: 2px dashed #111; padding-top: 10px; }
  .btn-imprimir { background: #8bc34a; color: #111; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1rem; }

  .item-mover { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 8px;}
  .item-mover label { font-size: 0.9rem; flex-grow: 1; }
  .input-mover { width: 60px; padding: 8px; text-align: center; background: #111; color: white; border: 1px solid #00bcd4; border-radius: 4px; font-weight: bold;}
  .btn-mover-confirm { background: #ff9800; color: #111; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1rem;}
</style>
</head>
<body>

<div id="vista-perfiles" class="vista activa">
    <h1>🍔 Selecciona tu Perfil</h1>
    <div class="grid-meseros" id="contenedor-meseros">
        <!-- Generado por JS -->
    </div>
</div>

<div id="vista-mesas" class="vista">
    <div class="header-mesas">
        <h1 id="titulo-saludo">Hola, Mesero</h1>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>
    <div class="grid-mesas" id="contenedor-mesas">
        <!-- Generado por JS -->
    </div>
</div>

<div id="vista-menu" class="vista">
    <div class="header-menu">
        <button class="btn-volver" onclick="volverAMesas()">⬅ Mesas</button>
        <h2 id="titulo-mesa-actual" style="margin: 0; color: #fff;">Mesa X</h2>
        <button class="btn-admin-accion" onclick="cambiarDeMesa()">🔄 Cambiar Mesa</button>
    </div>
    
    <div class="grid-menu" id="contenedor-menu">Cargando menú...</div>
    
    <button class="flotante-carrito" onclick="abrirCarrito()">📝 Ver Cuenta (<span id="contador-items">0</span>)</button>
</div>

<div id="modal-carrito" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; padding: 20px; box-sizing: border-box; overflow-y: auto;">
    <div style="background: #222; max-width: 500px; margin: 20px auto; padding: 20px; border-radius: 10px; color: white;">
        <h2>Cuenta de <span id="carrito-titulo-mesa"></span></h2>
        
        <div class="seccion-carrito" id="seccion-cocina">
            <h4>🔥 Ya en Cocina</h4>
            <div id="lista-cocina"></div>
        </div>

        <div class="seccion-carrito" id="seccion-pendientes">
            <h4>🛒 Por Enviar a Cocina</h4>
            <div id="lista-pendientes"></div>
        </div>
        
        <h3 style="text-align: right; color: #4caf50;">Total General: $<span id="total-carrito">0.00</span></h3>
        
        <button class="btn-accion-cuenta btn-mesa-abierta" onclick="enviarMesaAbierta()">🍽️ Mandar a Cocina y DEJAR MESA ABIERTA</button>
        <button class="btn-accion-cuenta btn-pedir-cuenta" onclick="enviarYPedirCuenta()">🧾 Mandar a Cocina y PEDIR CUENTA</button>
        <button class="btn-accion-cuenta" style="background: #f44336; color: white;" onclick="document.getElementById('modal-carrito').style.display='none'">Cerrar Ventana</button>
    </div>
</div>

<div id="modal-ticket" class="modal-ticket">
    <div class="ticket-content">
        <h3>🍔 CHULAS BURGERS 🍔<br><small>Ticket de Cuenta</small></h3>
        <p style="margin: 5px 0; font-size: 0.9rem;"><strong>Mesa:</strong> <span id="ticket-mesa"></span></p>
        <p style="margin: 5px 0 15px 0; font-size: 0.9rem;"><strong>Atendió:</strong> <span id="ticket-mesero"></span></p>
        
        <div id="ticket-items"></div>
        
        <div class="ticket-total">Total a Pagar: $<span id="ticket-total-val"></span></div>
        <p style="text-align: center; font-size: 0.8rem; margin-top: 10px; color: #555;">Sincronizado vía CONTROL_JEFE_99</p>
        
        <button class="btn-imprimir" style="background: #03a9f4; color: white;" onclick="enviarComprobanteActual()">📸 Subir Ticket de Transferencia</button>
        <button class="btn-imprimir" onclick="cerrarTicket()">Aceptar y Volver (Efectivo/Finalizar)</button>
    </div>
</div>

<script>
const menuBase = {
  "Hamburguesas": [
    { nombre: "Hamburguesa Sencilla", precio: 60, imagen: "clasica.jpg" },
    { nombre: "Hamburguesa Doble", precio: 80, imagen: "doble.jpeg" }
  ],
  "Hot Dogs": [
    { nombre: "Hot Dog", precio: 30, imagen: "hot.jpeg" },
    { nombre: "Orden de Hot Dogs", precio: 75, imagen: "Ordenhot.jpg" }
  ],
 "Especialidades": [
    { nombre: "Enchiladas", precio: 75, imagen: "enchiladas.jpeg" },
    { nombre: "Chilaquiles", precio: 65, imagen: "chilaquiles.jpg" },
    { nombre: "Club Sandwich", precio: 85, imagen: "club.jpg" },
    { nombre: "Sincronizadas Mexa", precio: 85, imagen: "sincromexa.jpeg" },
    { nombre: "Crepa Pizza", precio: 90, imagen: "sincrop.webp" }
  ],
  "Bebidas": [
    { nombre: "Refresco", precio: 25, imagen: "refrescosvarios.jpeg" },
    { nombre: "Coca Cola", precio: 25, imagen: "coca cola.jpeg" }
  ]
};

const configPorDefecto = [
    { id: 1, nombre: "Mesero 1", pin: "1111" },
    { id: 2, nombre: "Mesero 2", pin: "2222" },
    { id: 3, nombre: "Mesero 3", pin: "3333" },
    { id: 4, nombre: "Mesero 4", pin: "4444" },
    { id: 5, nombre: "Mesero 5", pin: "5555" }
];
let MESEROS = JSON.parse(localStorage.getItem('chulas_meseros_config')) || configPorDefecto;

let estadoMesas = {};
for(let i=1; i<=15; i++) {
    estadoMesas[`Mesa ${i}`] = { 
        estado: 'Libre',
        meseroId: null,
        meseroNombre: null,
        cocina: [],
        pendientes: []
    };
}

let meseroActual = null;
let mesaActual = null;

function cambiarVista(idVista) {
    document.querySelectorAll('.vista').forEach(v => v.classList.remove('activa'));
    document.getElementById(idVista).classList.add('activa');
}

function inicializar() {
    let htmlMeseros = "";
    MESEROS.forEach(m => {
        htmlMeseros += `<button class="btn-mesero" onclick="loginMesero(${m.id})">${m.nombre}</button>`;
    });
    document.getElementById('contenedor-meseros').innerHTML = htmlMeseros;
    renderizarMesas();
    cargarMenuUI();
}

function loginMesero(id) {
    let m = MESEROS.find(x => x.id === id);
    let pinIntento = prompt(`Ingrese PIN para ${m.nombre}:`);
    if(pinIntento === m.pin) {
        meseroActual = m;
        document.getElementById('titulo-saludo').innerText = `Hola, ${m.nombre}`;
        cambiarVista('vista-mesas');
    } else if (pinIntento !== null) {
        alert("PIN Incorrecto.");
    }
}

function cerrarSesion() {
    meseroActual = null;
    mesaActual = null;
    cambiarVista('vista-perfiles');
}

function renderizarMesas() {
    let html = "";
    for(let i=1; i<=15; i++) {
        let mesa = estadoMesas[`Mesa ${i}`];
        let claseExtra = mesa.estado === 'Ocupada' ? 'ocupada' : '';
        let nombreMesero = mesa.meseroNombre ? `<span class="etiqueta-mesero">Atiende: ${mesa.meseroNombre}</span>` : '';
        html += `<div class="btn-mesa ${claseExtra}" onclick="abrirMesa('Mesa ${i}')">
                    <strong>Mesa ${i}</strong>
                    <span>${mesa.estado}</span>
                    ${nombreMesero}
                 </div>`;
    }
    document.getElementById('contenedor-mesas').innerHTML = html;
}

function abrirMesa(idMesa) {
    let mesa = estadoMesas[idMesa];
    if (mesa.estado === 'Ocupada' && mesa.meseroId !== meseroActual.id) {
        alert(`Mesa atendida por ${mesa.meseroNombre}. Solo él puede modificarla.`);
        return;
    }

    mesaActual = idMesa;
    document.getElementById('titulo-mesa-actual').innerText = idMesa;
    
    if (mesa.estado === 'Libre') {
        mesa.meseroId = meseroActual.id;
        mesa.meseroNombre = meseroActual.nombre;
        mesa.estado = 'Ocupada';
        renderizarMesas();
    }

    actualizarContadorCarrito();
    cambiarVista('vista-menu');
}

function volverAMesas() {
    mesaActual = null;
    cambiarVista('vista-mesas');
}

function cargarMenuUI() {
    let html = "";
    for (let categoria in menuBase) {
        menuBase[categoria].forEach((p, idx) => {
            let idUnico = categoria.substring(0,3) + idx;
            html += `
            <div class="card-prod">
                <img src="imagenes/${p.imagen}" class="img-prod" alt="${p.nombre}">
                <h3 style="margin: 10px 0 0 0; font-size:1rem;">${p.nombre}</h3>
                <p class="precio">$${p.precio}</p>
                <div class="controles">
                    <input type="number" min="1" value="1" id="cant-${idUnico}" class="input-cant">
                    <input type="text" placeholder="Notas..." id="nota-${idUnico}" class="input-nota">
                </div>
                <button class="btn-add" onclick="agregarProducto('${p.nombre}', ${p.precio}, '${idUnico}')">Agregar</button>
            </div>`;
        });
    }
    document.getElementById('contenedor-menu').innerHTML = html;
}

function agregarProducto(nombre, precio, idUnico) {
    let cant = parseInt(document.getElementById(`cant-${idUnico}`).value) || 1;
    let nota = document.getElementById(`nota-${idUnico}`).value || '';
    
    estadoMesas[mesaActual].pendientes.push({
        nombre: nombre,
        precio: precio,
        cantidad: cant,
        subtotal: precio * cant,
        notas: nota
    });
    
    document.getElementById(`cant-${idUnico}`).value = 1;
    document.getElementById(`nota-${idUnico}`).value = '';
    actualizarContadorCarrito();
    alert(`Añadido: ${cant}x ${nombre}`);
}

function actualizarContadorCarrito() {
    if(!mesaActual) return;
    let totalItems = estadoMesas[mesaActual].pendientes.reduce((acc, p) => acc + p.cantidad, 0);
    document.getElementById('contador-items').innerText = totalItems;
}

function abrirCarrito() {
    if(!mesaActual) return;
    let mesa = estadoMesas[mesaActual];
    document.getElementById('carrito-titulo-mesa').innerText = mesaActual;

    let htmlCocina = "";
    let totalCocina = 0;
    mesa.cocina.forEach((p) => {
        htmlCocina += `<div class="item-carrito">
            <div><strong>${p.cantidad}x ${p.nombre}</strong> <small style="color:#aaa;">${p.notas}</small></div>
            <div>$${p.subtotal}</div>
        </div>`;
        totalCocina += p.subtotal;
    });
    document.getElementById('lista-cocina').innerHTML = htmlCocina || "<p style='color:#777;'>Nada en cocina aún.</p>";

    let htmlPend = "";
    let totalPend = 0;
    mesa.pendientes.forEach((p, index) => {
        htmlPend += `<div class="item-carrito">
            <div><strong>${p.cantidad}x ${p.nombre}</strong> <small style="color:#aaa;">${p.notas}</small></div>
            <div>
                <span style="margin-right:10px;">$${p.subtotal}</span>
                <button class="btn-eliminar" onclick="eliminarPendiente(${index})">X</button>
            </div>
        </div>`;
        totalPend += p.subtotal;
    });
    document.getElementById('lista-pendientes').innerHTML = htmlPend || "<p style='color:#777;'>Sin productos nuevos.</p>";

    document.getElementById('total-carrito').innerText = (totalCocina + totalPend).toFixed(2);
    document.getElementById('modal-carrito').style.display = 'block';
}

function eliminarPendiente(index) {
    estadoMesas[mesaActual].pendientes.splice(index, 1);
    abrirCarrito();
    actualizarContadorCarrito();
}

function enviarMesaAbierta() {
    enviarPedidoBackend('Abierta');
}

function enviarYPedirCuenta() {
    enviarPedidoBackend('Pendiente Cobro');
    mostrarTicket();
}

function enviarPedidoBackend(estadoCuenta) {
    let mesa = estadoMesas[mesaActual];
    if(mesa.pendientes.length === 0 && mesa.cocina.length === 0) {
        alert("La cuenta está vacía.");
        return;
    }

    mesa.cocina = mesa.cocina.concat(mesa.pendientes);
    mesa.pendientes = [];
    actualizarContadorCarrito();
    document.getElementById('modal-carrito').style.display = 'none';

    let totalCuenta = mesa.cocina.reduce((acc, p) => acc + p.subtotal, 0);

    let pedido = {
        mesa: mesaActual,
        mesero: meseroActual.nombre,
        total: totalCuenta,
        items: mesa.cocina,
        estado: estadoCuenta,
        origen: 'punto_staff_77'
    };

    fetch('/api/pedidos', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(pedido)
    }).then(res => {
        if(!res.ok) throw new Error("Error en servidor");
    }).catch(err => {
        console.warn("Fallo API, guardando en localStorage", err);
        let pedidosCaja = JSON.parse(localStorage.getItem('pedidos_caja')) || {};
        pedidosCaja[mesaActual] = pedido;
        localStorage.setItem('pedidos_caja', JSON.stringify(pedidosCaja));
    });

    alert(`Enviado a Cocina / Control Maestro como: ${estadoCuenta}`);
    if(estadoCuenta === 'Abierta') {
        volverAMesas();
    }
}

function mostrarTicket() {
    let mesa = estadoMesas[mesaActual];
    document.getElementById('ticket-mesa').innerText = mesaActual;
    document.getElementById('ticket-mesero').innerText = meseroActual.nombre;
    
    let htmlItems = "";
    let total = 0;
    mesa.cocina.forEach(p => {
        htmlItems += `<div class="ticket-item">
            <span>${p.cantidad}x ${p.nombre}</span>
            <span>$${p.subtotal}</span>
        </div>`;
        total += p.subtotal;
    });
    document.getElementById('ticket-items').innerHTML = htmlItems;
    document.getElementById('ticket-total-val').innerText = total.toFixed(2);
    document.getElementById('modal-ticket').style.display = 'flex';
}

function cerrarTicket() {
    document.getElementById('modal-ticket').style.display = 'none';
    estadoMesas[mesaActual] = {
        estado: 'Libre', meseroId: null, meseroNombre: null, cocina: [], pendientes: []
    };
    renderizarMesas();
    volverAMesas();
}

function enviarComprobanteActual() {
    alert("Sube el comprobante desde la aplicación del cliente o notifica a caja.");
}

function cambiarDeMesa() {
    alert("Por el momento, si necesitas mover la cuenta de mesa, contacta al Control Jefe 99.");
}

window.onload = inicializar;
</script>
</body>
</html>
