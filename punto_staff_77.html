<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punto Staff 77 - Chulas Burgers</title>
<style>
  body { background-color: #121216; color: #f5f5f7; font-family: sans-serif; margin: 0; padding: 15px; }
  h1 { text-align: center; color: #00bcd4; }
  .grid-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-bottom: 80px; }
  .card-prod { background: #1e1e24; border-radius: 8px; padding-bottom: 15px; text-align: center; border: 1px solid #333; }
  
  /* ESTANDARIZACIÓN DE IMÁGENES: IDENTICO A COMANDERO */
  .img-prod { width: 100%; height: 160px; object-fit: cover; border-radius: 8px 8px 0 0; display: block; }
  
  .precio { color: #ff9800; font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
  .controles { display: flex; gap: 5px; padding: 0 10px; margin-bottom: 10px; }
  .input-cant { width: 50px; padding: 8px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; text-align: center; }
  .input-nota { flex-grow: 1; padding: 8px; background: #111; color: #fff; border: 1px solid #444; border-radius: 4px; }
  .btn-add { background: #00bcd4; color: #111; border: none; padding: 10px; width: 90%; border-radius: 5px; font-weight: bold; cursor: pointer; }
  
  .flotante-carrito { position: fixed; bottom: 20px; right: 20px; background: #ff9800; color: #111; padding: 15px 20px; border-radius: 30px; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
  .modal-content { background: #2a2a35; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; border: 1px solid #00bcd4; max-height: 90vh; overflow-y: auto; text-align: center;}
  
  .btn-modal { padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-size: 1rem; }
  .btn-confirm { background: #8bc34a; color: #111; }
  .btn-close { background: #f44336; color: #fff; }
</style>
</head>
<body>

<h1>🧑‍🍳 Captura Staff 77</h1>
<div class="grid-menu" id="contenedor-menu">Cargando menú...</div>

<button class="flotante-carrito" onclick="abrirCarrito()">📝 Enviar a Caja (<span id="contador-items">0</span>)</button>

<!-- Modal Carrito Staff -->
<div id="modal-carrito" class="modal-overlay">
  <div class="modal-content">
    <h2 style="margin-top:0; color: #00bcd4;">📝 Resumen de Orden</h2>
    <div id="lista-carrito" style="text-align: left; margin-bottom: 15px;"></div>
    <h3 style="color:#8bc34a; text-align:right;">Total: $<span id="total-carrito">0.00</span></h3>
    
    <!-- SOLO PIDE NOMBRE / IDENTIFICADOR -->
    <div style="text-align: left; margin-bottom: 15px;">
      <label style="font-size: 0.9rem; color:#ccc;">Nombre de Cliente o Mesa:</label>
      <input type="text" id="nombre-cliente" placeholder="Ej. Juan Pérez" style="width: 93%; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #111; color: white; margin-top:5px;">
    </div>

    <button class="btn-modal btn-confirm" onclick="enviarPedidoStaff()">🚀 Lanzar a Cocina / Caja</button>
    <button class="btn-modal btn-close" onclick="document.getElementById('modal-carrito').style.display='none'">Regresar</button>
  </div>
</div>

<script>
// El mismo menú base configurado con precios e imágenes exactas
const menuBase = {
  "Hamburguesas": [
    { nombre: "Clásica", precio: 60, imagen: "clasica.jpg" },
    { nombre: "Doble", precio: 80, imagen: "doble.jpeg" }
  ],
  "Hot Dogs": [
    { nombre: "Hot Dog", precio: 30, imagen: "hot.jpg" },
    { nombre: "Orden de Hot Dogs", precio: 75, imagen: "Ordenhot.jpg" }
  ],
  "Especialidades": [
    { nombre: "Enchiladas", precio: 75, imagen: "enchiladas.jpeg" },
    { nombre: "Chilaquiles", precio: 65, imagen: "chilaquiles.jpg" },
    { nombre: "Club Sandwich", precio: 85, imagen: "club.jpg" },
    { nombre: "Sincronizadas Mexa", precio: 85, imagen: "sincromexa.jpeg" },
    { nombre: "Crepa Pizza", precio: 90, imagen: "sincrop.webp" }
  ],
  "Bebidas": [
    { nombre: "Refrescos Varios", precio: 25, imagen: "refrescosvarios.jpeg" },
    { nombre: "Coca Cola", precio: 25, imagen: "coca cola.jpeg" }
  ]
};

let carrito = [];

function cargarMenu() {
  fetch('/api/menu').then(r => r.json()).catch(() => menuBase).then(data => {
    let html = "";
    for (let cat in data) {
      data[cat].forEach((p, idx) => {
        if(p.disponible === false) return;
        let idFicticio = cat.charAt(0) + idx;
        html += `
          <div class="card-prod">
            <img src="imagenes/${p.imagen}" class="img-prod" alt="${p.nombre}">
            <h3 style="margin: 10px 0 0 0;">${p.nombre}</h3>
            <p class="precio">$${p.precio.toFixed(2)}</p>
            <div class="controles">
              <input type="number" min="1" value="1" id="cant-${idFicticio}" class="input-cant">
              <input type="text" placeholder="Notas (Ej. Sin cebolla)" id="nota-${idFicticio}" class="input-nota">
            </div>
            <button class="btn-add" onclick="addCarrito('${p.nombre}', ${p.precio}, '${idFicticio}')">Agregar</button>
          </div>
        `;
      });
    }
    document.getElementById('contenedor-menu').innerHTML = html;
  });
}

function addCarrito(nombre, precio, idElem) {
  let cant = parseInt(document.getElementById(`cant-${idElem}`).value) || 1;
  let notas = document.getElementById(`nota-${idElem}`).value;
  carrito.push({ nombre, precio, cantidad: cant, subtotal: precio * cant, notas });
  document.getElementById('contador-items').innerText = carrito.length;
  document.getElementById(`cant-${idElem}`).value = 1;
  document.getElementById(`nota-${idElem}`).value = '';
}

function abrirCarrito() {
  if (carrito.length === 0) return alert("Nada capturado aún.");
  let html = ""; let total = 0;
  carrito.forEach((i, idx) => {
    html += `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #444; padding:5px 0;">
      <div>${i.cantidad}x ${i.nombre} <br><small style="color:#aaa;">${i.notas}</small></div>
      <div>$${i.subtotal.toFixed(2)} <button onclick="quitarItem(${idx})" style="background:red;color:white;border:none;border-radius:3px;cursor:pointer;">X</button></div>
    </div>`;
    total += i.subtotal;
  });
  document.getElementById('lista-carrito').innerHTML = html;
  document.getElementById('total-carrito').innerText = total.toFixed(2);
  document.getElementById('modal-carrito').style.display = 'flex';
}

function quitarItem(idx) { carrito.splice(idx, 1); abrirCarrito(); document.getElementById('contador-items').innerText = carrito.length; if(carrito.length===0) document.getElementById('modal-carrito').style.display='none'; }

function enviarPedidoStaff() {
  let nombre = document.getElementById('nombre-cliente').value;
  if (!nombre) return alert("Obligatorio poner nombre o mesa.");
  
  let pedido = {
    cliente: nombre, total: carrito.reduce((sum, i) => sum + i.subtotal, 0), items: carrito, 
    estado: 'Pendiente', fecha: new Date().toLocaleTimeString(), metodo: 'Local'
  };

  fetch('/api/pedidos', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(pedido) })
  .catch(err => console.log("Guardado local mode"))
  .finally(() => {
    alert("✅ ¡Comanda enviada a Cocina/Caja!");
    carrito = [];
    document.getElementById('contador-items').innerText = "0";
    document.getElementById('nombre-cliente').value = '';
    document.getElementById('modal-carrito').style.display = 'none';
  });
}

cargarMenu();
</script>
</body>
</html>
