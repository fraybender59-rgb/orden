<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Maestro - Chulas Burgers</title>
<style>
  :root {
    --bg: #121216; --panel: #1e1e24; --card: #222;
    --text: #f5f5f7; --accent: #ff9800; --danger: #f44336;
    --success: #8bc34a; --info: #03a9f4;
  }
  body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; }
  
  /* Sistema de Login Integrado */
  #login-overlay { position: fixed; inset: 0; background: rgba(18,18,22,0.95); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .login-box { background: var(--panel); padding: 30px; border-radius: 12px; border: 1px solid #444; width: 90%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .login-box input { width: 100%; padding: 12px; margin: 15px 0; background: #111; color: white; border: 1px solid #555; border-radius: 6px; box-sizing: border-box; font-size: 1.1rem; text-align: center; }
  .login-box button { width: 100%; padding: 12px; background: var(--accent); color: #111; font-weight: bold; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; }

  .barra-nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; background: var(--panel); padding: 12px; border-radius: 10px; border: 1px solid #333; }
  .btn-nav { flex: 1; min-width: 120px; background: #333; color: #fff; padding: 12px 10px; border-radius: 6px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; text-align: center; font-size: 0.9rem;}
  
  .btn-historial { background: #9c27b0; }
  .btn-almacen { background: #00bcd4; color: #111; }
  
  .columna { background: #18181f; padding: 20px; border-radius: 12px; border: 1px solid #2a2a35; max-width: 650px; margin: 0 auto; }
  .titulo-columna { text-align: center; color: var(--accent); border-bottom: 2px solid #333; padding-bottom: 12px; margin-top: 0; }
  
  .tarjeta-pedido { background: var(--card); padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 6px solid var(--success); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .tarjeta-pedido.cancelado { border-left-color: var(--danger); opacity: 0.7; }
  .tarjeta-pedido.cobrado { border-left-color: #9c27b0; opacity: 0.8; }
  
  .grid-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
  .btn-act { padding: 12px; border: none; cursor: pointer; font-weight: bold; border-radius: 6px; font-size: 0.9rem; }
  .btn-pagado { background: var(--success); color: #111; }
  .btn-tarjeta { background: #3f51b5; color: #fff; }
  .btn-cortesia { background: var(--info); color: #fff; }
  .btn-cancelar { background: var(--danger); color: #fff; grid-column: span 2; }
  
  .btn-comprobante { background: var(--accent); color: #111; text-decoration: none; display: flex; align-items: center; justify-content: center; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 12px; }

  /* Modales Globales */
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: flex-start; padding-top: 50px; }
  .modal-content { background: #2a2a35; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid var(--accent); }
  .btn-modal { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 48%; font-size: 1rem;}
</style>
</head>
<body>

<!-- Seguridad UI Moderna -->
<div id="login-overlay">
  <div class="login-box">
    <h2 style="color: #ff9800; margin-top: 0;">🔐 Acceso Restringido</h2>
    <p style="color: #aaa; font-size: 0.9rem;">Ingresa la clave de administrador</p>
    <input type="password" id="admin-pass" placeholder="Clave..." onkeypress="if(event.key === 'Enter') verificarClave()">
    <button onclick="verificarClave()">Desbloquear Sistema</button>
    <p id="login-error" style="color: #f44336; display: none; font-weight: bold; margin-bottom: 0;">Clave incorrecta</p>
  </div>
</div>

<div class="barra-nav">
  <a href="comandero.html" target="_blank" class="btn-nav">📱 Comandero</a>
  <a href="punto_staff_77.html" target="_blank" class="btn-nav">🧑‍🍳 Staff 77</a>
  <a href="almacen.html" target="_blank" class="btn-nav btn-almacen">📦 Almacén</a>
  <button onclick="document.getElementById('modal-historial').style.display='flex';" class="btn-nav btn-historial">🗃️ Cierres</button>
</div>

<div class="columna">
  <h2 class="titulo-columna">📝 Caja Principal (Pedidos Activos)</h2>
  <div id="bandeja-caja">Cargando conexión con backend...</div>
</div>

<!-- Modal Historial -->
<div id="modal-historial" class="modal-overlay">
  <div class="modal-content">
    <h3 style="color:#ff9800; text-align:center; margin-top:0;">🗃️ Registro General</h3>
    <div id="total-ventas-historial" style="background: #111; color: #8bc34a; font-size: 1.5rem; text-align: center; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #8bc34a;">Total Vendido: $0.00</div>
    <div id="bandeja-historial" style="max-height: 50vh; overflow-y: auto;"></div>
    <button class="btn-modal" style="width: 100%; background: #f44336; color: white; margin-top: 15px;" onclick="document.getElementById('modal-historial').style.display='none'">Cerrar Registro</button>
  </div>
</div>

<!-- Modal Acción -->
<div id="modal-accion" class="modal-overlay">
  <div class="modal-content">
    <h3 id="titulo-accion" style="color:#ff9800; margin-top:0;">Acción</h3>
    <div id="cuerpo-accion" style="font-size: 1.1rem; text-align: center; margin-bottom: 20px;"></div>
    <div style="display: flex; justify-content: space-between;">
      <button class="btn-modal" style="background: #444; color: white;" onclick="document.getElementById('modal-accion').style.display='none'">Cancelar</button>
      <button class="btn-modal" style="background: #8bc34a; color: #111;" id="btn-confirmar-accion">Confirmar</button>
    </div>
  </div>
</div>

<script>
// --- SEGURIDAD ---
const CLAVE_MAESTRA = "IBARRITA";
function verificarClave() {
  const input = document.getElementById('admin-pass').value;
  if(input === CLAVE_MAESTRA) {
    document.getElementById('login-overlay').style.display = 'none';
    iniciarApp();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

// --- LOGICA PRINCIPAL (CONECTADA AL SERVIDOR FLASK) ---
let idSeleccionado = null;

function iniciarApp() {
  renderAdmin();
  setInterval(renderAdmin, 3000); // Polling cada 3s
}

function renderAdmin() {
  // Consumiendo la ruta /api/pedidos configurada en el backend
  fetch('/api/pedidos').then(r => r.json()).then(pedidos => {
    let htmlCaja = ""; let htmlHistorial = ""; let totalVentasCobradas = 0;

    pedidos.slice().reverse().forEach(p => {
      if (!p.id) return; 
      
      let estadoClase = p.estado === 'Cancelado' ? 'cancelado' : p.estado === 'Cobrado' ? 'cobrado' : '';
      let productosTexto = p.items.map(i => `<div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>${i.cantidad}x ${i.nombre}</span> <span>$${i.subtotal}</span></div>`).join('');
      let btnComprobante = p.comprobanteUrl ? `<a href="${p.comprobanteUrl}" target="_blank" class="btn-comprobante">📁 Ver Transferencia</a>` : '';
      
      let infoExtra = "";
      if (p.estado === 'Cobrado' || p.metodo_pago) { 
        infoExtra = `<div style="color:#8bc34a; font-weight:bold; margin-top:10px; text-align:center;">✅ Pagado en ${p.metodo_pago || p.metodo}</div>`; 
        totalVentasCobradas += parseFloat(p.total); 
      } 
      else if (p.estado === 'Cancelado') { 
        infoExtra = `<div style="color:#f44336; font-weight:bold; margin-top:10px; text-align:center;">❌ Cancelado</div>`; 
      }

      let botones = "";
      if (p.estado !== 'Cobrado' && p.estado !== 'Cancelado' && !p.metodo_pago) {
        botones = `
          <div class="grid-botones">
            <button class="btn-act btn-pagado" onclick="cobrar('${p.id}', 'Efectivo')">💵 EFECTIVO</button>
            <button class="btn-act btn-tarjeta" onclick="cobrar('${p.id}', 'Tarjeta')">💳 TARJETA</button>
            <button class="btn-act btn-cortesia" onclick="accion('${p.id}', 'Cortesía')">🎁 Cortesía</button>
            <button class="btn-act btn-cancelar" onclick="accion('${p.id}', 'Cancelado')">❌ Cancelar Orden</button>
          </div>`;
      }

      let tarjetaHTML = `
        <div class="tarjeta-pedido ${estadoClase}">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="font-size:1.2rem; color:var(--info);">${p.cliente}</strong>
            <span style="font-size:0.85rem; color:#aaa; background:#111; padding:3px 8px; border-radius:4px;">${p.fecha.split(' ')[1] || ''}</span>
          </div>
          <hr style="border-color:#333; margin:10px 0;">
          <div style="font-size: 0.95rem;">${productosTexto}</div>
          <hr style="border-color:#333; margin:10px 0;">
          <div style="font-size: 1.3rem; color:var(--accent); text-align:right;"><strong>Total: $${parseFloat(p.total).toFixed(2)}</strong></div>
          ${btnComprobante}
          ${infoExtra} ${botones}
        </div>`;

      if (p.estado === 'Cobrado' || p.estado === 'Cancelado' || p.metodo_pago) {
        htmlHistorial += tarjetaHTML; 
      } else {
        htmlCaja += tarjetaHTML;
      }
    });

    document.getElementById('bandeja-caja').innerHTML = htmlCaja || '<p style="color:#666; text-align:center; font-style:italic;">Bandeja limpia. Sin pedidos pendientes.</p>';
    document.getElementById('bandeja-historial').innerHTML = htmlHistorial || '<p style="color:#666; text-align:center;">Sin registros para mostrar.</p>';
    document.getElementById('total-ventas-historial').innerText = `Total de Ingresos: $${totalVentasCobradas.toFixed(2)}`;
  }).catch(err => {
    document.getElementById('bandeja-caja').innerHTML = '<p style="color:#f44336; text-align:center;">Desconectado del servidor.</p>';
  });
}

window.cobrar = function(id, metodo) {
  idSeleccionado = id; 
  document.getElementById('titulo-accion').innerText = `Confirmar Pago: ${metodo}`;
  document.getElementById('cuerpo-accion').innerHTML = `<p>¿Marcar orden como pagada por <b>${metodo}</b>?</p>`;
  document.getElementById('btn-confirmar-accion').onclick = () => procesarCobro(id, metodo);
  document.getElementById('modal-accion').style.display = 'flex';
};

function procesarCobro(id, metodo) {
  // Conectando al endpoint de cobro de servidor.py
  fetch('/api/pedidos/cobrar', { 
    method: 'POST', 
    headers: { 'Content-Type': 'application/json' }, 
    body: JSON.stringify({ id: id, metodo: metodo }) 
  })
  .then(() => { 
    document.getElementById('modal-accion').style.display = 'none'; 
    renderAdmin(); 
  })
  .catch(() => alert("Error al conectar con el servidor."));
}

window.accion = function(id, tipo) {
  idSeleccionado = id; 
  let div = document.getElementById('cuerpo-accion'); 
  document.getElementById('titulo-accion').innerText = `Aplicar ${tipo}`;
  
  if (tipo === 'Cortesía') {
    div.innerHTML = `<p>¿Aplicar cortesía (Costo $0.00)?</p>`;
    document.getElementById('btn-confirmar-accion').onclick = () => procesarCobro(id, 'Cortesía');
  } else if (tipo === 'Cancelado') {
    div.innerHTML = `<p style="color:var(--danger)">¿Estás seguro de cancelar esta orden?</p>`;
    document.getElementById('btn-confirmar-accion').onclick = () => procesarCobro(id, 'Cancelado');
  }
  document.getElementById('modal-accion').style.display = 'flex';
};
</script>
</body>
</html>
