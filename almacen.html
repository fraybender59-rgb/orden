<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén e Inventario - Chulas Burgers</title>
    <style>
        body {
            background-color: #121216;
            color: #f5f5f7;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-refresh {
            background-color: #8bc34a;
            color: #111;
            padding: 15px;
            width: 100%;
            max-width: 900px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 25px;
            transition: background 0.3s;
        }
        .btn-refresh:hover { background-color: #7cb342; }

        table {
            width: 100%;
            max-width: 900px;
            border-collapse: collapse;
            background-color: #1e1e24;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        th {
            color: #ffb74d;
            padding: 15px;
            border: 1px solid #333;
            background-color: #1a1a20;
            font-size: 1.1rem;
        }

        td {
            padding: 12px 15px;
            text-align: center;
            border: 1px solid #333;
            font-size: 1.05rem;
        }

        .producto-nombre { font-weight: bold; color: #fff; }
        
        .estado-disponible { color: #8bc34a; font-weight: bold; }
        .estado-bajo { color: #ff9800; font-weight: bold; }
        .estado-agotado { color: #f44336; font-weight: bold; }

        .acciones-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .input-accion {
            width: 60px;
            padding: 8px;
            background: #111;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .btn-add {
            background: #ffb74d;
            color: #111;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .btn-del {
            background: #e53935;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        .bottom-bar {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 900px;
            margin-top: 25px;
            background: #1e1e24;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            box-sizing: border-box;
            align-items: center;
        }

        .bottom-bar input {
            padding: 12px;
            background: #111;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            font-size: 1rem;
        }

        #nuevo-nombre { flex: 1; }
        #nuevo-cant { width: 100px; text-align: center; }

        .btn-add-new {
            background: #03a9f4;
            color: #111;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <button class="btn-refresh" onclick="cargarInventario()">🔄 Refrescar Inventario (Clic aquí si hubo ventas)</button>

    <table>
        <thead>
            <tr>
                <th>Producto (Nombre Exacto)</th>
                <th>Existencias</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-inventario">
            <!-- El contenido se genera con JavaScript -->
        </tbody>
    </table>

    <div class="bottom-bar">
        <input type="text" id="nuevo-nombre" placeholder="Nombre del platillo...">
        <input type="number" id="nuevo-cant" placeholder="Cant." min="0">
        <button class="btn-add-new" onclick="agregarNuevoProducto()">➕ Agregar</button>
    </div>

    <script>
        const inventarioPorDefecto = [
            { nombre: "Hamburguesa Sencilla", stock: 50 },
            { nombre: "Hamburguesa Doble", stock: 50 },
            { nombre: "Hot Dog", stock: 50 },
            { nombre: "Orden de Hot Dogs", stock: 50 },
            { nombre: "Sincronizadas Mexa", stock: 50 },
            { nombre: "Papas Fritas", stock: 50 },
            { nombre: "Refresco", stock: 50 }
        ];

        let inventarioGlobal = [];

        async function cargarInventario() {
            try {
                const response = await fetch('/api/inventario');
                if (response.ok) {
                    inventarioGlobal = await response.json();
                } else {
                    throw new Error("API no disponible");
                }
            } catch (error) {
                // Respaldo Automático Local
                let localData = JSON.parse(localStorage.getItem('chulas_inventario'));
                if (!localData || localData.length === 0) {
                    localData = inventarioPorDefecto;
                    localStorage.setItem('chulas_inventario', JSON.stringify(localData));
                }
                inventarioGlobal = localData;
            }
            renderizarTabla();
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tabla-inventario');
            let html = "";

            inventarioGlobal.forEach((item, index) => {
                let claseEstado = "estado-disponible";
                let textoEstado = "Disponible";

                if (item.stock <= 0) {
                    claseEstado = "estado-agotado";
                    textoEstado = "Agotado";
                } else if (item.stock < 15) {
                    claseEstado = "estado-bajo";
                    textoEstado = "Poco";
                }

                html += `
                    <tr>
                        <td class="producto-nombre">${item.nombre}</td>
                        <td>${item.stock} pz</td>
                        <td class="${claseEstado}">${textoEstado}</td>
                        <td>
                            <div class="acciones-container">
                                <input type="number" id="input-sumar-${index}" class="input-accion" value="10" min="1">
                                <button class="btn-add" onclick="sumarStock(${index})">➕</button>
                                <button class="btn-del" onclick="eliminarProducto(${index})">X</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        async function sumarStock(index) {
            const inputCantidad = document.getElementById(`input-sumar-${index}`);
            const cantidad = parseInt(inputCantidad.value);

            if (isNaN(cantidad) || cantidad <= 0) return alert("Ingresa una cantidad válida a sumar.");

            let item = inventarioGlobal[index];

            try {
                const response = await fetch('/api/inventario/sumar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: item.nombre, cantidad: cantidad })
                });
                if (!response.ok) throw new Error("Fallo API");
            } catch (error) {
                item.stock += cantidad;
                localStorage.setItem('chulas_inventario', JSON.stringify(inventarioGlobal));
            }

            inputCantidad.value = ""; 
            cargarInventario(); 
        }

        async function eliminarProducto(index) {
            if (!confirm(`¿Eliminar ${inventarioGlobal[index].nombre} del inventario?`)) return;

            let item = inventarioGlobal[index];

            try {
                await fetch('/api/inventario/eliminar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: item.nombre })
                });
            } catch (error) {
                inventarioGlobal.splice(index, 1);
                localStorage.setItem('chulas_inventario', JSON.stringify(inventarioGlobal));
            }

            cargarInventario();
        }

        async function agregarNuevoProducto() {
            const nombre = document.getElementById('nuevo-nombre').value.trim();
            const cantidad = parseInt(document.getElementById('nuevo-cant').value);

            if (!nombre) return alert("Escribe el nombre del platillo/producto.");
            if (isNaN(cantidad) || cantidad < 0) return alert("Ingresa una cantidad inicial válida.");

            try {
                const response = await fetch('/api/inventario/nuevo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombre, stock: cantidad })
                });
                if (!response.ok) throw new Error("Fallo API");
            } catch (error) {
                inventarioGlobal.push({ nombre: nombre, stock: cantidad });
                localStorage.setItem('chulas_inventario', JSON.stringify(inventarioGlobal));
            }

            document.getElementById('nuevo-nombre').value = "";
            document.getElementById('nuevo-cant').value = "";
            cargarInventario();
        }

        cargarInventario();
        setInterval(cargarInventario, 3000);

    </script>
</body>
</html>
