<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Almacén - Chulas Burgers</title>
<style>
  :root {
    --bg-main: #121216;
    --bg-card: #1e1e24;
    --bg-item: #111116;
    --accent: #00bcd4;
    --text-main: #f5f5f7;
    --ok-color: #8bc34a;
    --low-color: #ff9800;
    --empty-color: #f44336;
    --border-color: #333;
  }
  
  body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; }
  h1 { text-align: center; color: var(--accent); margin-bottom: 5px; font-size: 1.8rem; }
  p.sub { text-align: center; color: #aaa; margin-top: 0; margin-bottom: 20px; font-size: 0.9rem; }
  
  .contenedor-almacen { max-width: 800px; margin: 0 auto; }
  
  .grid-insumos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
  .item-insumo { background: var(--bg-item); border: 1px solid #2a2a35; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s;}
  .item-insumo:active { transform: scale(0.98); }
  
  .nombre-prod { font-weight: bold; font-size: 1.1rem; color: #fff; text-align: center; }
  .precio-prod { text-align: center; color: #aaa; font-size: 0.85rem; margin-top: 5px; }
  
  .stock-status { margin: 15px 0; font-size: 1.5rem; font-weight: bold; text-align: center; }
  .badge-ok { color: var(--ok-color); }
  .badge-low { color: var(--low-color); }
  .badge-empty { color: var(--empty-color); }
  
  .controles-stock { display: flex; gap: 8px; justify-content: center; align-items: center; }
  .btn-qty { background: #333; color: white; border: none; width: 40px; height: 40px; font-size: 1.5rem; font-weight: bold; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;}
  .btn-qty:active { background: var(--accent); color: #111; }
  .inp-stock { width: 60px; height: 38px; text-align: center; background: var(--bg-card); color: white; border: 1px solid #555; border-radius: 6px; font-weight: bold; font-size: 1.2rem;}
  
  .acciones-globales { display: flex; justify-content: space-between; gap: 10px; margin: 30px auto; max-width: 800px;}
  .btn-accion { flex: 1; text-align: center; padding: 15px; text-decoration: none; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 1rem;}
  .btn-volver { background: #333; color: white; border: 1px solid #555; }
  .btn-reiniciar { background: var(--empty-color); color: white; }
</style>
</head>
<body>

<div class="contenedor-almacen">
  <h1>📦 Control de Inventario</h1>
  <p class="sub">Sincronizado en tiempo real con el servidor</p>

  <div class="grid-insumos" id="contenedor-categorias">
    <p style="text-align: center; width: 100%; color: #aaa;">Conectando con el servidor...</p>
  </div>

  <div class="acciones-globales">
    <a href="administracion.html" class="btn-accion btn-volver">⬅️ Volver</a>
    <button onclick="reiniciarInventario()" class="btn-accion btn-reiniciar">🔄 Reiniciar a 100pz</button>
  </div>
</div>

<script>
let inventarioGlobal = [];

// Obtener inventario desde servidor.py
async function fetchInventario() {
  try {
    const response = await fetch('/api/inventario');
    if (!response.ok) throw new Error('Error en red');
    inventarioGlobal = await response.json();
    renderAlmacen();
  } catch (error) {
    document.getElementById('contenedor-categorias').innerHTML = '<p style="color:#f44336; text-align:center;">Error de conexión con el servidor. Verifica que tu backend esté en ejecución.</p>';
  }
}

function renderAlmacen() {
  let html = "";
  inventarioGlobal.forEach((item, index) => {
    let claseBadge = item.stock > 15 ? 'badge-ok' : item.stock > 0 ? 'badge-low' : 'badge-empty';
    let textoEstado = item.stock > 15 ? 'Óptimo' : item.stock > 0 ? 'Bajo' : 'Agotado';
    
    html += `
      <div class="item-insumo">
        <div>
            <div class="nombre-prod">${item.nombre}</div>
            <div class="precio-prod">$${item.precio.toFixed(2)}</div>
        </div>
        <div class="stock-status ${claseBadge}">
          <span id="cant-${index}">${item.stock}</span> 
          <div style="font-size:0.8rem; margin-top:2px;">${textoEstado}</div>
        </div>
        <!-- CONTROLES PARA AGREGAR STOCK MANUALMENTE -->
        <div class="controles-stock" style="margin-top: 10px; display: flex; gap: 5px;">
          <input type="number" id="add-stock-${index}" class="inp-stock" value="1" min="1" style="width: 60px; padding: 5px; border-radius: 5px; border: 1px solid #444; background: #222; color: white;">
          <button class="btn-qty" style="padding: 5px 10px; font-size: 0.9rem; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer;" onclick="sumarStock('${item.nombre}', ${index})">➕ Ingresar</button>
        </div>
      </div>`;
  });
  document.getElementById('contenedor-categorias').innerHTML = html;
}

async function sumarStock(nombre, index) {
  let inputStock = document.getElementById(`add-stock-${index}`);
  let cantidadAAgregar = parseInt(inputStock.value);
  
  if (!cantidadAAgregar || cantidadAAgregar <= 0) return alert("Ingresa una cantidad válida.");

  try {
    await fetch('/api/inventario/sumar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre: nombre, cantidad: cantidadAAgregar })
    });
    
    inputStock.value = 1;
    fetchInventario(); 
  } catch (e) {
    console.error(e);
    alert("Error al conectar con el servidor.");
  }
}

// Función para reiniciar el inventario a 100 piezas (Faltaba en el código original)
async function reiniciarInventario() {
  if(!confirm("¿Estás seguro de reiniciar TODO el inventario a 100 piezas?")) return;
  
  try {
    const response = await fetch('/api/inventario/reiniciar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });
    
    if (!response.ok) throw new Error("Error en el servidor al reiniciar");
    
    alert("Inventario reiniciado con éxito.");
    fetchInventario(); // Recarga la interfaz con los nuevos valores
  } catch (e) {
    console.error("Error al reiniciar:", e);
    alert("Error al intentar reiniciar el inventario en el servidor. Asegúrate de tener configurada la ruta en tu backend.");
  }
}

// Iniciar la carga del inventario al abrir la página
fetchInventario();
</script>
</body>
</html>
