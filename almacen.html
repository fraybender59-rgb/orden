<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Almacén - Chulas Burgers</title>
<style>
  body { background-color: #121216; color: #f5f5f7; font-family: sans-serif; margin: 0; padding: 15px; }
  h1 { text-align: center; color: #00bcd4; margin-bottom: 5px; }
  p.sub { text-align: center; color: #aaa; margin-top: 0; margin-bottom: 20px; font-size: 0.9rem; }
  
  .contenedor-almacen { max-width: 800px; margin: 0 auto; }
  .seccion-cat { background: #1e1e24; border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid #333; }
  .titulo-cat { color: #ffb74d; border-bottom: 1px solid #444; padding-bottom: 8px; margin-top: 0; }
  
  .grid-insumos { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .item-insumo { background: #111116; border: 1px solid #2a2a35; padding: 12px; border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; }
  .nombre-prod { font-weight: bold; font-size: 1rem; color: #fff; }
  
  .stock-status { margin: 10px 0; font-size: 1.1rem; font-weight: bold; text-align: center; }
  .badge-ok { color: #8bc34a; }
  .badge-low { color: #ff9800; }
  .badge-empty { color: #f44336; }
  
  .controles-stock { display: flex; gap: 5px; justify-content: center; align-items: center; }
  .btn-qty { background: #333; color: white; border: 1px solid #555; padding: 5px 12px; font-size: 1.2rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
  .btn-qty:hover { background: #00bcd4; color: #111; }
  .inp-stock { width: 50px; text-align: center; background: #1e1e24; color: white; border: 1px solid #444; padding: 5px; border-radius: 4px; font-weight: bold; }
  
  .btn-volver { display: block; width: 200px; margin: 30px auto; text-align: center; background: #333; color: white; padding: 10px; text-decoration: none; border-radius: 5px; font-weight: bold; border: 1px solid #555; }
</style>
</head>
<body>

<div class="contenedor-almacen">
  <h1>📦 Control de Almacén e Inventario</h1>
  <p class="sub">Gestión de existencias en tiempo real para Chulas Burgers</p>

  <div id="contenedor-categorias">Cargando inventario...</div>

  <a href="administracion.html" class="btn-volver">⬅️ Volver a Administración</a>
</div>

<script>
// Lista de Productos Sincronizada con Comandero y Staff 77
const inventarioInicial = {
  "Hamburguesas": [
    { nombre: "Clásica", stock: 20 },
    { nombre: "Doble", stock: 15 }
  ],
  "Hot Dogs": [
    { nombre: "Hot Dog", stock: 30 },
    { nombre: "Orden de Hot Dogs", stock: 12 }
  ],
  "Especialidades": [
    { nombre: "Enchiladas", stock: 10 },
    { nombre: "Chilaquiles", stock: 15 },
    { nombre: "Club Sandwich", stock: 10 },
    { nombre: "Sincronizadas Mexa", stock: 10 },
    { nombre: "Crepa Pizza", stock: 8 }
  ],
  "Bebidas": [
    { nombre: "Refrescos Varios", stock: 40 },
    { nombre: "Coca Cola", stock: 50 }
  ]
};

let almacenData = JSON.parse(localStorage.getItem('almacen_chulas')) || inventarioInicial;

function renderAlmacen() {
  let html = "";
  for (let cat in almacenData) {
    html += `<div class="seccion-cat">
      <h3 class="titulo-cat">📂 ${cat}</h3>
      <div class="grid-insumos">`;
      
    almacenData[cat].forEach((item, index) => {
      let claseBadge = item.stock > 5 ? 'badge-ok' : item.stock > 0 ? 'badge-low' : 'badge-empty';
      let textoEstado = item.stock > 5 ? 'En Stock' : item.stock > 0 ? 'Stock Bajo' : 'Agotado';
      
      html += `
        <div class="item-insumo">
          <div class="nombre-prod">${item.nombre}</div>
          <div class="stock-status ${claseBadge}">
            <span id="cant-${cat}-${index}">${item.stock}</span> <small style="font-size:0.7rem;">(${textoEstado})</small>
          </div>
          <div class="controles-stock">
            <button class="btn-qty" onclick="modificarStock('${cat}', ${index}, -1)">-</button>
            <input type="number" class="inp-stock" value="${item.stock}" onchange="cambiarDirecto('${cat}', ${index}, this.value)">
            <button class="btn-qty" onclick="modificarStock('${cat}', ${index}, 1)">+</button>
          </div>
        </div>`;
    });

    html += `</div></div>`;
  }
  document.getElementById('contenedor-categorias').innerHTML = html;
}

function modificarStock(cat, idx, cambio) {
  almacenData[cat][idx].stock = Math.max(0, almacenData[cat][idx].stock + cambio);
  guardarYActualizar();
}

function cambiarDirecto(cat, idx, valor) {
  let valNum = parseInt(valor) || 0;
  almacenData[cat][idx].stock = Math.max(0, valNum);
  guardarYActualizar();
}

function guardarYActualizar() {
  localStorage.setItem('almacen_chulas', JSON.stringify(almacenData));
  fetch('/api/almacen', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(almacenData)
  }).catch(() => {});
  renderAlmacen();
}

renderAlmacen();
</script>
</body>
</html>
